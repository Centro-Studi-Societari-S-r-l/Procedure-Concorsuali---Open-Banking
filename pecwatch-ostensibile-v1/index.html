<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>PECWatch — Mockup ostensibile completo v1</title><style>body{margin:0;display:grid;place-items:center;min-height:100vh;font:14px Arial,sans-serif;background:#f4f7fb;color:#17304d}main{max-width:520px;padding:24px;text-align:center}.spin{width:34px;height:34px;margin:0 auto 14px;border:4px solid #dce8f6;border-top-color:#1767d8;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}p{color:#61758d}</style></head><body data-build="20260827"><main><div class="spin"></div><strong>Caricamento PECWatch…</strong><p>Mockup ostensibile completo v1.</p></main><script>(async()=>{try{const names=['payload/f01a.txt','payload/f01b.txt','payload/c02.txt','payload/f03a.txt','payload/f03b.txt','payload/c04.txt','payload/f05a.txt','payload/f05b.txt','payload/c06.txt','payload/f07a.txt','payload/f07b.txt','payload/c08.txt'];const parts=await Promise.all(names.map(async n=>{const r=await fetch(n,{cache:'force-cache'});if(!r.ok)throw new Error(n+': '+r.status);return r.text()}));const raw=atob(parts.join('').replace(/\s/g,''));const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();location.replace(URL.createObjectURL(new Blob([html],{type:'text/html'})))}catch(e){document.querySelector('main').innerHTML='<strong>Impossibile caricare il mockup.</strong><p>Aggiornare il browser o ricaricare la pagina tra qualche secondo.</p>';console.error(e)}})();</script></body></html>
