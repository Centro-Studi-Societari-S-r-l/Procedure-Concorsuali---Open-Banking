  </svg>

  <div id="app" class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="Navigazione principale">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48"><rect x="4" y="8" width="34" height="27" rx="5" fill="none" stroke="currentColor" stroke-width="3"/><path d="m6 12 15 11 15-11" fill="none" stroke="currentColor" stroke-width="3"/><path d="M30 23.5 40 20l6 3v7.5c0 6-4.2 9.6-8 11-3.8-1.4-8-5-8-11Z" fill="#fff" stroke="currentColor" stroke-width="2.5"/><path d="m34 30 3 3 5-6" fill="none" stroke="currentColor" stroke-width="2.5"/></svg>
        </div>
        <div class="brand-copy"><strong>PECWatch</strong><span>Centro Studi Societari</span></div>
      </div>

      <nav id="nav" class="nav"></nav>

      <div class="sync-widget">
        <div class="sync-widget-head"><span>Sincronizzazione caselle</span><strong>2 / 2 OK</strong></div>
        <div class="progress"><span style="width:100%"></span></div>
        <div class="sync-widget-foot">Prossimo giro: 25/08/2026 07:00</div>
      </div>
      <button id="collapseSidebar" class="sidebar-collapse" type="button">
        <svg class="icon"><use href="#i-chevron-left"></use></svg><span>Riduci menu</span>
      </button>
    </aside>

    <main class="main-shell">
      <header class="topbar">
        <button id="mobileMenu" class="icon-button mobile-only" type="button" aria-label="Apri menu"><svg class="icon"><use href="#i-menu"></use></svg></button>
        <div class="page-title-wrap"><h1 id="pageTitle">Coda di lavoro</h1><span class="demo-pill">Demo pubblica anonimizzata · API simulate</span></div>
        <div class="global-search-wrap">
          <svg class="icon search-icon"><use href="#i-search"></use></svg>
          <input id="globalSearch" class="global-search" type="search" placeholder="Cerca società, mittente, oggetto, protocollo…" autocomplete="off" />
          <kbd>⌘ K</kbd>
          <div id="globalSearchResults" class="global-search-results hidden"></div>
        </div>
        <div class="topbar-status"><span class="meta">Ultimo aggiornamento: <strong>24/08/2026 15:03</strong></span><span class="sync-ok"><svg class="icon"><use href="#i-sync"></use></svg>Sincronizzato</span></div>
        <button class="icon-button notify" type="button" aria-label="Notifiche" data-action="open-notifications"><svg class="icon"><use href="#i-bell"></use></svg><span>3</span></button>
        <button class="icon-button" type="button" aria-label="Guida" data-action="open-help"><svg class="icon"><use href="#i-help"></use></svg></button>
        <button id="userMenuBtn" class="user-menu-button" type="button" data-action="open-user-menu"><span><strong>Utente Demo</strong><small>admin</small></span><span class="avatar">FC</span></button>
      </header>

      <section id="content" class="content" aria-live="polite"></section>
    </main>

    <aside id="detailDrawer" class="detail-drawer" aria-label="Dettaglio attività"></aside>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
